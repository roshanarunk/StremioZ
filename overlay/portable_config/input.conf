# StremioZ key bindings (while the player is open).
#
# AnimeJaNai owns Ctrl+0-9, Shift+1-3, Ctrl+J and Ctrl+E (same keys as the
# standalone mpv-AnimeJaNai). Community's Anime4K shader presets move to Alt.

# Stremio's web UI forwards keys to mpv as "CTRL+J" / "SHIFT+2" (capital letter,
# Shift+digit rather than the shifted symbol), so both spellings are bound.
# ---- AnimeJaNai (scripts/animejanai_slot.lua switches slots at runtime) ----
Ctrl+e  nonrepeatable script-message animejanai-manager
Ctrl+E  nonrepeatable script-message animejanai-manager
Ctrl+j  script-binding "show_animejanai_stats"
Ctrl+J  script-binding "show_animejanai_stats"
Ctrl+0  show-text "AnimeJaNai off"; apply-profile upscale-on; script-message aji-slot 0
!       show-text "AnimeJaNai: Quality"; apply-profile upscale-on; script-message aji-slot 1001
Shift+1 show-text "AnimeJaNai: Quality"; apply-profile upscale-on; script-message aji-slot 1001
@       show-text "AnimeJaNai: Balanced"; apply-profile upscale-on; script-message aji-slot 1002
Shift+2 show-text "AnimeJaNai: Balanced"; apply-profile upscale-on; script-message aji-slot 1002
SHARP   show-text "AnimeJaNai: Performance"; apply-profile upscale-on; script-message aji-slot 1003
Shift+3 show-text "AnimeJaNai: Performance"; apply-profile upscale-on; script-message aji-slot 1003
Ctrl+1  show-text "AnimeJaNai: Custom 1"; apply-profile upscale-on; script-message aji-slot 1
Ctrl+2  show-text "AnimeJaNai: Custom 2"; apply-profile upscale-on; script-message aji-slot 2
Ctrl+3  show-text "AnimeJaNai: Custom 3"; apply-profile upscale-on; script-message aji-slot 3
Ctrl+4  show-text "AnimeJaNai: Custom 4"; apply-profile upscale-on; script-message aji-slot 4
Ctrl+5  show-text "AnimeJaNai: Custom 5"; apply-profile upscale-on; script-message aji-slot 5
Ctrl+6  show-text "AnimeJaNai: Custom 6"; apply-profile upscale-on; script-message aji-slot 6
Ctrl+7  show-text "AnimeJaNai: Custom 7"; apply-profile upscale-on; script-message aji-slot 7
Ctrl+8  show-text "AnimeJaNai: Custom 8"; apply-profile upscale-on; script-message aji-slot 8
Ctrl+9  show-text "AnimeJaNai: Custom 9"; apply-profile upscale-on; script-message aji-slot 9

# ---- Anime4K GLSL presets (from Stremio Community), now on Alt ----
Alt+1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A (HQ)"
Alt+2 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode B (HQ)"
Alt+3 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode C (HQ)"
Alt+4 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A+A (HQ)"
Alt+5 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode B+B (HQ)"
Alt+6 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode C+A (HQ)"
Alt+7 no-osd change-list glsl-shaders set "~~/shaders/FSR.glsl"; show-text "FSR"
Alt+0 no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared"

# ---- From Stremio Community ----
F1 af toggle "lavfi=[loudnorm=I=-22:TP=-1.5:LRA=2]" ; show-text "Audio Normalization is now: ${af}"
F2 cycle-values sub-ass-override "force" "strip" "no"; show-text "sub-ass-override=${sub-ass-override}"
