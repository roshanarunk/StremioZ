###### StremioZ controller helpers (sent by webmods/StremioZ/tv-navigation.js as keypresses)
Ctrl+Shift+RIGHT  seek 85
Ctrl+Shift+LEFT   seek -85
Ctrl+Shift+UP     add speed 0.25; show-text "Speed ${speed}x"
Ctrl+Shift+DOWN   add speed -0.25; show-text "Speed ${speed}x"
Ctrl+Shift+HOME   set speed 1; show-text "Speed ${speed}x"
