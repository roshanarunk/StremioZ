# StremioZ key bindings (while the player is open)
#
# Stremio's web UI forwards keys to mpv as "CTRL+J" / "SHIFT+2" (capital letter,
# Shift+digit rather than the shifted symbol), so AnimeJaNai keys are bound in
# both spellings. Below them: Stremio Kai's bindings
# (vendor/kai/input.conf.kai-original) without SVP (F12, Ctrl+F12) and without
# "q quit", which would shut down the embedded player core.

###### AnimeJaNai
# Presets go through profile-manager.lua (stremioz-set-upscaler), which re-runs
# the chain for the current video: `apply-profile upscale-on` would replace the
# whole filter chain and drop RTX Video HDR. Custom slots use the slot switch.

Ctrl+e  nonrepeatable script-message animejanai-manager
Ctrl+E  nonrepeatable script-message animejanai-manager
Ctrl+j  script-binding "show_animejanai_stats"
Ctrl+J  script-binding "show_animejanai_stats"
Ctrl+0   script-message-to profile_manager stremioz-set-upscaler off
!        script-message-to profile_manager stremioz-set-upscaler ajn-quality
Shift+1  script-message-to profile_manager stremioz-set-upscaler ajn-quality
@        script-message-to profile_manager stremioz-set-upscaler ajn-balanced
Shift+2  script-message-to profile_manager stremioz-set-upscaler ajn-balanced
SHARP    script-message-to profile_manager stremioz-set-upscaler ajn-performance
Shift+3  script-message-to profile_manager stremioz-set-upscaler ajn-performance
# RTX Video HDR on/off for this video (also becomes the default)
Ctrl+h   script-message-to profile_manager stremioz-set-rtx-hdr toggle
Ctrl+H   script-message-to profile_manager stremioz-set-rtx-hdr toggle
# Custom slots from the AnimeJaNai Manager (Ctrl+1-4 belong to Kai's thin-line shaders)
Ctrl+Shift+1 show-text "AnimeJaNai: Custom 1"; apply-profile upscale-on; script-message aji-slot 1
Ctrl+Shift+2 show-text "AnimeJaNai: Custom 2"; apply-profile upscale-on; script-message aji-slot 2
Ctrl+Shift+3 show-text "AnimeJaNai: Custom 3"; apply-profile upscale-on; script-message aji-slot 3
Ctrl+Shift+4 show-text "AnimeJaNai: Custom 4"; apply-profile upscale-on; script-message aji-slot 4
Ctrl+Shift+5 show-text "AnimeJaNai: Custom 5"; apply-profile upscale-on; script-message aji-slot 5
Ctrl+Shift+6 show-text "AnimeJaNai: Custom 6"; apply-profile upscale-on; script-message aji-slot 6
Ctrl+Shift+7 show-text "AnimeJaNai: Custom 7"; apply-profile upscale-on; script-message aji-slot 7
Ctrl+Shift+8 show-text "AnimeJaNai: Custom 8"; apply-profile upscale-on; script-message aji-slot 8
Ctrl+Shift+9 show-text "AnimeJaNai: Custom 9"; apply-profile upscale-on; script-message aji-slot 9

###### General

t      		script-binding stats/display-stats-toggle
T      		script-binding stats/display-page-2
u           	cycle-values panscan 0 0.5 1.0

###### Audio

`		    script-message cycle-audio-preset
        
