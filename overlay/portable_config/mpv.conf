# StremioZ mpv settings
#
# Layering, in order:
#   1. AnimeJaNai's managed defaults (mpv-animejanai.conf, shipped unchanged)
#   2. Stremio Kai's tuning (from Kai's mpv.conf, see vendor/kai/mpv.conf.kai-original)
#   3. StremioZ overrides
# Per-file decisions (anime detection, upscaler, HDR, colour profile, audio
# preset) are made by scripts/profile-manager.lua, which owns `vf`.
# Put personal tweaks at the very end.

include="~~/mpv-animejanai.conf"
profile=animejanai

# Start with no video filter: profile-manager.lua inserts AnimeJaNai (@aji)
# once it knows the file is anime. (The animejanai profile above adds it for
# every file.)
vf=

log-file=~~/mpv.log

#########
#  OSD  #  (Kai)
#########

osd-font=Nata Sans
osd-font-size=40
osd-color=0.0/0.0/0.0/1.0
osd-outline-size=1.5
osd-outline-color=1.0/1.0/1.0/1.0
osd-blur=0.1
osd-align-x=center
osd-bar=no
osd-margin-y=50
osd-duration=3000
osd-scale-by-window=yes
script-opts=console-font_size=10

#########
# Cache #  (Kai)
#########

gpu-shader-cache-dir=~~/cache/shaders
icc-cache-dir=~~/cache/icc

cache=yes
cache-secs=900
demuxer-readahead-secs=180
demuxer-max-back-bytes=512MiB
demuxer-max-bytes=1024MiB
stream-buffer-size=128MiB
demuxer-seekable-cache=yes
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_delay_max=5

########
# Subs #  (Kai)
########

sub-font='Nata Sans'
sub-font-size=48
sub-bold=yes
sub-border-size=0.5
sub-shadow-offset=1.3
sub-margin-y=0
sub-use-margins=yes
embeddedfonts=yes

##################################
# Rendering baseline (Kai, merged)
##################################
# Kept from AnimeJaNai, NOT taken from Kai:
#   gpu-api=vulkan  - mpv's only CUDA interop is with Vulkan; TensorRT frames are CUDA.
#   hwdec=nvdec     - set by AnimeJaNai's backend script (d3d11va + gpu-api=d3d11 for DirectML).
vo=gpu-next
profile=high-quality
vd-queue-enable=no

target-prim=auto
target-trc=auto
target-contrast=auto

deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=0

dither=fruit
dither-depth=10
temporal-dither=yes
temporal-dither-period=1

scale=spline36
cscale=lanczos
dscale=mitchell
scale-antiring=0.7
cscale-antiring=0.7
dscale-antiring=0.7
sigmoid-upscaling=yes
linear-downscaling=no
correct-downscaling=yes

###################
# StremioZ overrides
###################

# Stremio stores and restores the watch position itself; mpv's watch-later
# files would fight it.
save-position-on-quit=no
reset-on-next-file=

# Track choice belongs to Stremio and Kai's smart track selector.
alang=
slang=

screenshot-directory=~~/screenshots/

############################## PROFILES ##############################
# Applied per file by profile-manager.lua (Kai). They hold static settings
# only; shaders, filters and HDR handling are set by the script.
######################################################################

[sdr]
scale=spline36
cscale=mitchell

[anime-sdr]
scale=ewa_lanczos
cscale=ewa_lanczos
scale-radius=3.2384
scale-blur=1.05
deband-iterations=2
deband-threshold=45
deband-range=16
deband-grain=20

# ===== Your settings below =====
