# StremioZ mpv settings.
#
# AnimeJaNai's managed defaults (mpv-animejanai.conf, shipped unchanged from
# the AnimeJaNai release) are applied first; the lines below override them for
# use inside Stremio. Put personal tweaks at the end of this file.

include="~~/mpv-animejanai.conf"
profile=animejanai

# ===== Stremio overrides =====

# Stremio stores and restores the watch position itself; mpv's watch-later
# files would fight it.
save-position-on-quit=no
reset-on-next-file=

# Track choice is Stremio's (and later the smart track selector's), not a
# hard-coded Japanese/English preference.
alang=
slang=

# Keep the OSD clear of Stremio's player controls.
osd-margin-y=50

# Screenshots go next to the config instead of the managed default path.
screenshot-directory=~~/screenshots/

# ===== Your settings below =====
